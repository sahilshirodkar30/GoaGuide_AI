
name: CD to AWS EC2

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: goaguide-ai

jobs:
  check-status:
    name: Verify CI result
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        run: echo "CI passed. Starting deployment."

  build-and-push:
    name: Build and push UI and API
    needs: check-status
    runs-on: ubuntu-latest

    outputs:
      api_image: ${{ steps.images.outputs.api_image }}
      ui_image: ${{ steps.images.outputs.ui_image }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build -f Dockerfile.api \
            -t "$REGISTRY/$ECR_REPOSITORY:api-$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:api-$IMAGE_TAG"

      - name: Build and push UI
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build -f Dockerfile.ui \
            -t "$REGISTRY/$ECR_REPOSITORY:ui-$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:ui-$IMAGE_TAG"

      - name: Export image references
        id: images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "api_image=$REGISTRY/$ECR_REPOSITORY:api-$IMAGE_TAG" \
            >> "$GITHUB_OUTPUT"
          echo "ui_image=$REGISTRY/$ECR_REPOSITORY:ui-$IMAGE_TAG" \
            >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy both containers to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          API_IMAGE: ${{ needs.build-and-push.outputs.api_image }}
          UI_IMAGE: ${{ needs.build-and-push.outputs.ui_image }}
          AWS_REGION: ${{ env.AWS_REGION }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: API_IMAGE,UI_IMAGE,AWS_REGION
          command_timeout: 10m
          script: |
            set -eu

            APP_DIR="/opt/goaguide-ai"
            NETWORK="goaguide-network"

            cd "$APP_DIR"

            ECR_REGISTRY="${API_IMAGE%%/*}"

            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            # Pull before stopping the currently running version.
            docker pull "$API_IMAGE"
            docker pull "$UI_IMAGE"

            docker network inspect "$NETWORK" >/dev/null 2>&1 \
              || docker network create "$NETWORK"

            test -f "$APP_DIR/.env"
            test -f "$APP_DIR/nginx.conf"

            # Save current image references for manual recovery.
            {
              docker inspect --format='{{.Config.Image}}' goaguide-api \
                2>/dev/null || true
              docker inspect --format='{{.Config.Image}}' goaguide-ui \
                2>/dev/null || true
            } > "$APP_DIR/previous-images.txt"

            docker rm -f goaguide-api goaguide-ui \
              goaguide-nginx 2>/dev/null || true

            docker run -d \
              --name goaguide-api \
              --network "$NETWORK" \
              --restart unless-stopped \
              --env-file "$APP_DIR/.env" \
              "$API_IMAGE"

            docker run -d \
              --name goaguide-ui \
              --network "$NETWORK" \
              --restart unless-stopped \
              -e API_BASE_URL="http://goaguide-api:8000" \
              "$UI_IMAGE"

            docker run -d \
              --name goaguide-nginx \
              --network "$NETWORK" \
              --restart unless-stopped \
              -p 80:80 \
              -p 443:443 \
              -v "$APP_DIR/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
              nginx:alpine

            # Wait for API and UI to become available.
            for i in $(seq 1 30); do
              if curl --fail --silent http://localhost/api/ >/dev/null \
                && curl --fail --silent http://localhost/ >/dev/null; then
                echo "UI and API are responding."
                exit 0
              fi
              sleep 5
            done

            echo "Deployment health check failed."
            docker logs --tail 100 goaguide-api || true
            docker logs --tail 100 goaguide-ui || true
            docker logs --tail 100 goaguide-nginx || true
            exit 1
