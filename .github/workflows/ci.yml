
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run GoaGuide AI tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Supply safe test-only values if configuration requires them.
          # Replace names with the variables actually used by your app.
          GROQ_API_KEY: test-key
        run: uv run pytest tests -v
